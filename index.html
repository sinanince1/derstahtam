  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:linear-gradient(135deg,#A8D5D0,#8FB8DE);font-family:"Segoe UI",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .kutu{background:var(--krem);border-radius:40px;box-shadow:0 30px 80px rgba(74,55,40,.35);padding:44px 54px 40px;width:560px;text-align:center}
  h1{margin:0 0 4px;font-size:44px;color:var(--kahve)}
  p{margin:0 0 22px;font-size:21px;font-weight:600;color:var(--kahve-acik);line-height:1.35}

  .tuslar{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:10px}
  .tuslar button{border:none;border-radius:20px;background:#fff;box-shadow:0 6px 14px rgba(74,55,40,.14);font-family:inherit;
    font-size:34px;font-weight:900;color:var(--kahve);padding:18px 0;cursor:pointer}
  .tuslar button:active{transform:scale(.94)}
  .tuslar button.ok{background:var(--yesil);color:#fff;font-size:26px}
  .tuslar button.sil{font-size:24px;color:var(--kahve-acik)}
  .uyari{min-height:30px;margin-top:14px;font-size:21px;font-weight:800;color:var(--kiremit)}
  .yukleniyor{font-size:26px;font-weight:800;color:var(--kahve-acik)}
  .gizle{display:none}
</style>

const ANAHTAR_DEPO = "sinifPanosu_kilit";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let giris = "";

function goster() {
  document.getElementById("gosterge").textContent = giris ? "*".repeat(giris.length) : "– – – – – –";
}
function tuslariKur() {
  const t = document.getElementById("tuslar");
  const dugmeler = ["1","2","3","4","5","6","7","8","9","sil","0","ok"];
  t.innerHTML = dugmeler.map(d =>
    d === "sil" ? '<button class="sil" data-d="sil">Sil</button>'
    : d === "ok" ? '<button class="ok" data-d="ok">Aç</button>'
    : '<button data-d="' + d + '">' + d + '</button>').join("");
  t.onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    const d = b.dataset.d;
    if (d === "sil") giris = giris.slice(0, -1);
    else if (d === "ok") return dene(giris);
    else if (giris.length < 12) giris += d;
    goster();
  };
  document.addEventListener("keydown", e => {
    if (/^[0-9]$/.test(e.key) && giris.length < 12) { giris += e.key; goster(); }
    else if (e.key === "Backspace") { giris = giris.slice(0, -1); goster(); }
    else if (e.key === "Enter") dene(giris);
  });
}
async function coz(sifre) {
  const kok = await crypto.subtle.importKey("raw", new TextEncoder().encode(sifre), "PBKDF2", false, ["deriveKey"]);
  const anahtar = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(PAKET.s), iterations: PAKET.t, hash: "SHA-256" },
    kok, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const acik = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(PAKET.i) }, anahtar, b64(PAKET.d));
  return new TextDecoder().decode(acik);
}
function panoyuAc(html) {
  /* pano açıldıktan sonra da uygulama kimliği korunsun */
  html = html.replace("</head>", '<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#E08A3C"></head>');
  document.open();
  document.write(html);
  document.close();
}
async function dene(sifre, sessiz) {
  if (!sifre) return;
  document.getElementById("uyari").textContent = "";
  document.getElementById("ekran").classList.add("gizle");
  document.getElementById("yukleniyor").classList.remove("gizle");
  try {
    const html = await coz(sifre);
    try { localStorage.setItem(ANAHTAR_DEPO, sifre); } catch (e) {}
    panoyuAc(html);
  } catch (e) {
    try { if (sessiz) localStorage.removeItem(ANAHTAR_DEPO); } catch (e2) {}
    giris = ""; goster();
    document.getElementById("yukleniyor").classList.add("gizle");
    document.getElementById("ekran").classList.remove("gizle");
    document.getElementById("uyari").textContent = sessiz ? "Kayıtlı şifre geçersiz, tekrar gir" : "Şifre yanlış";
  }
}
if ("serviceWorker" in navigator) {                      // çevrimdışı da açılsın
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
(function basla() {
  tuslariKur(); goster();
  let kayitli = null;
  try { kayitli = localStorage.getItem(ANAHTAR_DEPO); } catch (e) {}
  if (!window.crypto || !crypto.subtle) {
    document.getElementById("aciklama").textContent = "Bu tarayıcı panoyu açamıyor. Lütfen güncel Chrome kullan (https gerekir).";
    document.getElementById("ekran").classList.add("gizle");
    return;
  }
  if (kayitli) dene(kayitli, true);                      // ilk açılıştan sonra bir daha sorulmaz
})();
</script>
